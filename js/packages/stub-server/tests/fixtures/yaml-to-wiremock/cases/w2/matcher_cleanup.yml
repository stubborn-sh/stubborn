request:
  method: POST
  url: /mc
  body:
    a:
      b: 1
    arr:
      - id: 1
        v: x
      - id: 2
        v: y
    keep: k
    nested:
      deep:
        list: [1, 2]
    s: "a/b"
  matchers:
    body:
      - path: $.a.b
        type: by_regex
        value: "[0-9]"
      - path: $.arr[*].id
        type: by_regex
        value: "[0-9]+"
      - path: $.arr[0].v
        type: by_equality
      - path: $.nested.deep.list
        type: by_type
        minOccurrence: 1
      - path: $.s
        type: by_regex
        value: "a/b"
      - path: $.keep
        type: by_regex
        value: 'k\/'
response:
  status: 200
