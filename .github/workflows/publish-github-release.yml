name: Publish GitHub Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0) — must be an existing git tag v<version>'
        required: true

permissions:
  contents: write

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'liberica'

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: "v${{ inputs.version }}"

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build broker exec JAR
        run: ./mvnw package -pl broker -am -DskipTests -DskipStubs=true

      - name: Create GitHub Release with assets
        # Inlined (rather than calling scripts/release/create-github-release.sh) so this
        # standalone workflow works for any tag, including ones cut before that script
        # existed. Idempotent: create the release if absent, else refresh the assets.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          JAR="broker/target/stubborn-broker-${VERSION}-exec.jar"
          if [ ! -f "$JAR" ]; then echo "::error::exec jar not found: $JAR"; exit 1; fi

          CHECKSUMS="stubborn-${VERSION}-checksums.txt"
          ( cd "$(dirname "$JAR")" && sha256sum "$(basename "$JAR")" ) > "$CHECKSUMS"

          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          ## Run the broker

          Docker:

          \`\`\`bash
          docker pull mgrzejszczak/stubborn:${VERSION}
          docker run -p 8080:8080 mgrzejszczak/stubborn:${VERSION}
          \`\`\`

          Standalone JAR (attached below):

          \`\`\`bash
          java -jar stubborn-broker-${VERSION}-exec.jar
          \`\`\`

          Maven artifacts: [Maven Central](https://central.sonatype.com/namespace/sh.stubborn) &middot; NPM packages: [@stubborn-sh](https://www.npmjs.com/org/stubborn-sh)
          EOF

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} exists — refreshing assets."
            gh release upload "v${VERSION}" "$JAR" "$CHECKSUMS" --clobber
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --generate-notes \
              --verify-tag \
              "$JAR" "$CHECKSUMS"
          fi
