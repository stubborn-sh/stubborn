name: Publish GitHub Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0) — must be an existing git tag v<version>'
        required: true

permissions:
  contents: write

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'liberica'

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: "v${{ inputs.version }}"

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build broker exec JAR
        run: ./mvnw package -pl broker -am -DskipTests -DskipStubs=true

      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release/create-github-release.sh "${{ inputs.version }}"
