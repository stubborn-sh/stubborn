name: Dependabot Grace Merge

# Backstop / grace-period companion to dependabot-auto-merge.yml.
#
#   * Non-security patch / minor Dependabot PRs merge once they are green AND
#     older than the grace period (2 days) — the window a human has to object.
#   * Security PRs merge as soon as they are green, with no age gate (a backstop
#     for dependabot-auto-merge.yml, in case repo-level auto-merge is off).
#   * Major updates are never merged here.
#
# The eligibility + merge logic lives in scripts/ci/dependabot-grace-merge.sh
# (BATS-tested via script-tests.yml); merges are green-gated (`gh pr checks`).

on:
  schedule:
    - cron: '0 6 * * *'   # daily, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  grace-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Merge eligible Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GRACE_DAYS: '2'
        run: bash scripts/ci/dependabot-grace-merge.sh
