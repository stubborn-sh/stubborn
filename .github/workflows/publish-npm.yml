name: Publish NPM Packages
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.1.0)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check packages exist on npm (first publish must be manual)
        run: scripts/publish/check-packages-exist.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Set versions
        working-directory: js
        run: ../scripts/publish/set-npm-versions.sh "${{ inputs.version }}"
      - name: Update inter-package dependencies
        working-directory: js
        run: ../scripts/publish/update-package-deps.sh "${{ inputs.version }}"
      - name: Install dependencies
        working-directory: js
        run: npm ci
      - name: Build
        working-directory: js
        run: npm run build
      - name: Test
        working-directory: js
        run: npm run test:ci
      - name: Publish
        working-directory: js
        run: npm publish --workspaces --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
