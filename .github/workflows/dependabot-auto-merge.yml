name: Dependabot Auto-Merge

# Auto-merge policy for Dependabot PRs (see also dependabot-grace-merge.yml):
#
#   * Security (CVE) updates      -> auto-merge as soon as CI is green, any semver level.
#   * Non-security patch / minor  -> labelled here; merged by dependabot-grace-merge.yml
#                                    once green AND older than a 2-day grace period.
#   * Major updates               -> left for a human. Never auto-merged.
#
# Runs on pull_request_target so the GITHUB_TOKEN can act on Dependabot PRs. It
# never checks out or executes PR code — only reads Dependabot metadata and runs
# gh CLI commands — so the elevated context is safe.

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v2

      - name: Label the update (semver level + security)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          GHSA_ID: ${{ steps.meta.outputs.ghsa-id }}
        run: |
          set -euo pipefail
          level="${UPDATE_TYPE#version-update:semver-}"   # patch | minor | major
          gh label create "dependabot:${level}" --color ededed --force >/dev/null 2>&1 || true
          gh pr edit "$PR_URL" --add-label "dependabot:${level}" || true
          if [ -n "${GHSA_ID}" ]; then
            gh label create "dependabot:security" --color b60205 --force >/dev/null 2>&1 || true
            gh pr edit "$PR_URL" --add-label "dependabot:security" || true
          fi

      # Security fix at any semver level: merge as soon as required checks pass.
      - name: Enable auto-merge for security updates
        if: ${{ steps.meta.outputs.ghsa-id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
