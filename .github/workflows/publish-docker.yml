name: Publish Docker Image
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and push (e.g., 0.2.0) — must be an existing git tag v<version>'
        required: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'liberica'

jobs:
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: "v${{ inputs.version }}"

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build broker image
        # The broker binds spring-boot's `build-image-no-fork` goal to the
        # pre-integration-test phase, so an `install` build through that phase produces
        # docker.io/<user>/stubborn:<version> directly. `-DskipStubs=true` skips the
        # RestDocs `stubs-jar` assembly (also on pre-integration-test), which fails with
        # "archive cannot be empty" when snippets are absent under `-DskipTests`.
        run: ./mvnw install -pl broker -am -DskipTests -DskipStubs=true

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Tag and push Docker images
        run: scripts/release/push-docker-images.sh "${{ inputs.version }}"
