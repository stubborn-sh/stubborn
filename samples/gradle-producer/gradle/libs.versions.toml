[versions]
spring-boot = "4.0.3"
springCloudBom = "2025.1.1"
stubbornContract = "0.1.0-SNAPSHOT"

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
stubborn-contract-verifier = { module = "sh.stubborn:stubborn-contract-verifier" }
rest-assured-spring-mock-mvc = { module = "io.rest-assured:spring-mock-mvc", version = "6.0.0" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }
stubborn-contract = { id = "sh.stubborn.contract", version.ref = "stubbornContract" }
